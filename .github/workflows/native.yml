name: Swift native macOS Universal beta
on:
  push:
    branches: ['main', 'feature/swift-native']
    tags: ['v0.5.*']
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: vpn-helper/go.sum
      - name: Native Swift protocol and lifecycle tests
        run: swift test
        working-directory: native
      - run: python3 scripts/prepare-vpn.py
      - name: Patched protocol lifecycle regression tests
        run: go test -race ./client/easyconnect
        working-directory: .build/zju-connect
      - name: Go core race regression tests
        run: go test -race ./...
        working-directory: vpn-helper
      - name: Native UTUN smoke
        run: |
          go test -c -o ../.build/mchip-helper.test .
          sudo env MCHIP_TUN_SMOKE=1 ../.build/mchip-helper.test -test.run '^TestNativeUTUNSmoke$' -test.v
        working-directory: vpn-helper
      - name: Build Universal native application
        run: python3 scripts/package-native.py
      - name: Persistent service signed-client reuse smoke
        timeout-minutes: 2
        run: python3 -c 'import subprocess; subprocess.run(["dist-native/Connect.app/Contents/MacOS/Connect", "--service-smoke"], check=True, timeout=60)'
      - name: Native window and status bar smoke
        timeout-minutes: 2
        run: python3 -c 'import subprocess; subprocess.run(["dist-native/Connect.app/Contents/MacOS/Connect", "--ui-smoke"], check=True, timeout=60)' 
      - name: Verify source provenance and archive
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=m-chip-vpn-login/ HEAD -o dist-native/Connect-0.5.0-beta.10-source.zip
          cp .build/upstream.tar.gz dist-native/zju-connect-c19eb4ed-source.tar.gz
          cp .build/compress.tar.gz dist-native/compress-1.18.6-source.tar.gz
          ditto -c -k --sequesterRsrc --keepParent dist-native/Connect.app dist-native/Connect-0.5.0-beta.10-mac-universal.zip
          cd dist-native
          shasum -a 256 *.zip *-source.tar.gz build-info.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-native-universal-beta
          path: |
            dist-native/*.zip
            dist-native/*-source.tar.gz
            dist-native/build-info.json
            dist-native/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-native-ui-previews
          path: dist-native/*-preview.png
  publish:
    needs: native-test-and-package
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-native-beta]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Connect-native-universal-beta
          path: dist-native
      - name: Publish native prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          gh release create v0.5.0-beta.10 --target "$BUILD_SHA" --repo "$GITHUB_REPOSITORY" --prerelease --title 'Connect v0.5.0-beta.10 · Swift native Universal' --notes 'Separates server shutdown (command 0x08), temporary reconnect rejection, and unauthenticated resource responses instead of reporting all as authentication failure. Temporary reconnect rejection now receives bounded backoff retries and retains its cause on exhaustion; terminal shutdown is never retried with the same session. Includes wrapped-error classification, delayed-reconnect, shutdown and retry-exhaustion regressions alongside existing protocol/Swift/Go/UTUN/service/UI checks. Specific EHR gateway behavior remains unverified without runtime gateway diagnostics. Universal macOS 13+, ad-hoc signed, AGPL source included.' dist-native/*.zip dist-native/*-source.tar.gz dist-native/build-info.json dist-native/SHA256SUMS.txt
