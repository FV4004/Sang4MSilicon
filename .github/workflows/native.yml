name: Swift native macOS Universal beta
on:
  push:
    branches: ['main', 'feature/swift-native']
    tags: ['v0.5.*']
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: vpn-helper/go.sum
      - name: Native Swift protocol and lifecycle tests
        run: swift test
        working-directory: native
      - run: python3 scripts/prepare-vpn.py
      - name: Patched protocol lifecycle regression tests
        run: go test -race ./client/easyconnect
        working-directory: .build/zju-connect
      - name: Go core race regression tests
        run: go test -race ./...
        working-directory: vpn-helper
      - name: Native UTUN smoke
        run: |
          go test -c -o ../.build/mchip-helper.test .
          sudo env MCHIP_TUN_SMOKE=1 ../.build/mchip-helper.test -test.run '^TestNativeUTUNSmoke$' -test.v
        working-directory: vpn-helper
      - name: Build Universal native application
        run: python3 scripts/package-native.py
      - name: Persistent service signed-client reuse smoke
        timeout-minutes: 2
        run: python3 -c 'import subprocess; subprocess.run(["dist-native/Connect.app/Contents/MacOS/Connect", "--service-smoke"], check=True, timeout=60)'
      - name: Native window and status bar smoke
        timeout-minutes: 2
        run: python3 -c 'import subprocess; subprocess.run(["dist-native/Connect.app/Contents/MacOS/Connect", "--ui-smoke"], check=True, timeout=60)' 
      - name: Verify source provenance and archive
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=m-chip-vpn-login/ HEAD -o dist-native/Connect-0.5.0-beta.9-source.zip
          cp .build/upstream.tar.gz dist-native/zju-connect-c19eb4ed-source.tar.gz
          cp .build/compress.tar.gz dist-native/compress-1.18.6-source.tar.gz
          ditto -c -k --sequesterRsrc --keepParent dist-native/Connect.app dist-native/Connect-0.5.0-beta.9-mac-universal.zip
          cd dist-native
          shasum -a 256 *.zip *-source.tar.gz build-info.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-native-universal-beta
          path: |
            dist-native/*.zip
            dist-native/*-source.tar.gz
            dist-native/build-info.json
            dist-native/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-native-ui-previews
          path: dist-native/*-preview.png
  publish:
    needs: native-test-and-package
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-native-beta]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Connect-native-universal-beta
          path: dist-native
      - name: Publish native prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          gh release create v0.5.0-beta.9 --target "$BUILD_SHA" --repo "$GITHUB_REPOSITORY" --prerelease --title 'Connect v0.5.0-beta.9 · Swift native Universal' --notes 'Adds bounded data-channel reconnection at IPv4 packet boundaries; partial frames are discarded and ambiguous writes are not replayed. Expired resource responses and missing attributes no longer trigger parser panics; shutdown/re-login responses receive authentication errors. Session keepalive interval is 20 seconds; cancellation deadline callbacks are drained before stream handoff. Cleanup confirmation is preserved after recovered worker panic when network cleanup succeeded. Protocol regression tests cover expiry/missing fields and cancellation race; tunnel tests cover partial receive, partial send and cancellation, plus existing Swift/Go/UTUN/service/UI checks. Real EHR gateway behavior still requires installation testing. Universal macOS 13+, ad-hoc signed, AGPL source included.' dist-native/*.zip dist-native/*-source.tar.gz dist-native/build-info.json dist-native/SHA256SUMS.txt
