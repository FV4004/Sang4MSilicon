name: macOS arm64 beta
on:
  push:
    branches: ['main', 'feature/resource-catalog-and-lifecycle']
    tags: ['v0.1.*', 'v0.2.*', 'v0.3.*', 'v0.4.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix app
      - run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: vpn-helper/go.sum
      - run: python3 scripts/prepare-vpn.py
      - run: go test -race ./...
        working-directory: vpn-helper
      - name: Exercise native UTUN on isolated macOS runner
        run: |
          go test -c -o ../.build/mchip-helper.test .
          sudo env MCHIP_TUN_SMOKE=1 ../.build/mchip-helper.test -test.run '^TestNativeUTUNSmoke$' -test.v
        working-directory: vpn-helper
      - run: go test ./client/easyconnect ./stack/gvisor ./resolve ./dial
        working-directory: .build/zju-connect
      - name: Build native VPN helper
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -trimpath -o ../.build/mchip-vpn-helper .
        working-directory: vpn-helper
      - run: npm run package:mac
      - name: Verify architecture and sign locally
        shell: bash
        run: |
          set -euo pipefail
          app_path='dist/M Chip VPN Login-darwin-arm64/M Chip VPN Login.app'
          test "$(lipo -archs "$app_path/Contents/MacOS/M Chip VPN Login")" = arm64
          test "$(lipo -archs "$app_path/Contents/Resources/bin/mchip-vpn-helper")" = arm64
          codesign --force --sign - "$app_path/Contents/Resources/bin/mchip-vpn-helper"
          codesign --verify --strict "$app_path/Contents/Resources/bin/mchip-vpn-helper"
          codesign --force --deep --sign - --entitlements scripts/entitlements.plist "$app_path"
          shasum -a 256 "$app_path/Contents/Resources/bin/mchip-vpn-helper" | awk '{print $1}' > "$app_path/Contents/Resources/bin/mchip-vpn-helper.sha256"
          codesign --force --sign - --entitlements scripts/entitlements.plist "$app_path"
          codesign --verify --deep --strict "$app_path"
          node scripts/verify-package.cjs "$app_path"
          node -e 'const fs = require("node:fs"); const p="dist/build-info.json"; const m=JSON.parse(fs.readFileSync(p)); m.adHocSigned=true; m.developerIdSigned=false; m.commit=process.env.GITHUB_SHA; fs.writeFileSync(p,JSON.stringify(m,null,2));'
      - name: Create distribution archive
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent 'dist/M Chip VPN Login-darwin-arm64/M Chip VPN Login.app' 'dist/MChipVPNLogin-0.4.0-beta.1-mac-arm64.zip'
          git archive --format=zip --prefix=m-chip-vpn-login/ HEAD -o dist/MChipVPNLogin-0.4.0-beta.1-source.zip
          cp .build/upstream.tar.gz dist/zju-connect-c19eb4ed-source.tar.gz
          cp .build/compress.tar.gz dist/compress-1.18.6-source.tar.gz
          cd dist
          shasum -a 256 MChipVPNLogin-0.4.0-beta.1-mac-arm64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MChipVPNLogin-mac-arm64-beta
          path: |
            dist/MChipVPNLogin-0.4.0-beta.1-mac-arm64.zip
            dist/MChipVPNLogin-0.4.0-beta.1-source.zip
            dist/*-source.tar.gz
            dist/SHA256SUMS.txt
            dist/build-info.json
  publish:
    if: github.event_name == 'push'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MChipVPNLogin-mac-arm64-beta
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          release_tag="v0.4.0-beta.1"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then release_tag="$GITHUB_REF_NAME"; fi
          gh release create "$release_tag" --target "$BUILD_SHA" --repo "$GITHUB_REPOSITORY" --prerelease --title "M Chip VPN Login $release_tag" --notes 'Resource catalog integration branch beta. Adds grouping, names, addresses and ports with search/pagination, direct HTTP/HTTPS opening after TUN connects, and gateway Web proxy access in isolated ephemeral browser windows. First window close offers Quit or Minimize with remembered choice; explicit quit disconnects TUN and attempts server logout before clearing local sessions. Main branch is unchanged. SSO automation and native remote application launching are outside this beta. Mock gateway/lifecycle tests and macOS UTUN/signing checks passed; real resource gateway compatibility needs user testing. No Apple Developer ID or notarization. AGPL source included.' dist/*.zip dist/*-source.tar.gz dist/SHA256SUMS.txt dist/build-info.json
